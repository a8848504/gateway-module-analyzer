name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - run: go test -v ./...
      - run: go vet ./...
      - name: Verify the Netsh compatibility capture
        env:
          GATEWAY_TEST_NETSH: '1'
        run: go test -v ./internal/capture -run '^TestNetshCompatibilityOnWindows$' -count=1 -timeout=3m
      - name: Verify the desktop executable starts
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H windowsgui' -o desktop-smoke.exe ./cmd/gateway-analyzer
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $app = Start-Process -FilePath (Join-Path $PWD desktop-smoke.exe) -PassThru
          try {
            $until = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 200
              $app.Refresh()
              if ($app.HasExited) { throw "GUI exited with code $($app.ExitCode)" }
            } until ($app.MainWindowHandle -ne [IntPtr]::Zero -or [DateTime]::UtcNow -gt $until)
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Desktop window was not created' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Build both Windows executables
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -H windowsgui -X main.version=$VERSION -X main.releaseRepo=$GITHUB_REPOSITORY" \
              -o "dist/GatewayModuleAnalyzer-Windows-$arch.exe" ./cmd/gateway-analyzer
          done
          cp internal/capture/third_party/etl2pcapng/LICENSE.txt dist/Microsoft-etl2pcapng-LICENSE.txt
          cd dist
          sha256sum ./*.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --verify-tag --latest --generate-notes \
            dist/GatewayModuleAnalyzer-Windows-amd64.exe dist/GatewayModuleAnalyzer-Windows-arm64.exe \
            dist/SHA256SUMS.txt dist/Microsoft-etl2pcapng-LICENSE.txt
